# Deploy staging: push main → Cloud Run (futai-member-api)
# Secrets: GitHub Environment "staging" — see docs/ENV-MANIFEST.txt
name: Deploy Staging

on:
  push:
    branches: [main]
    paths:
      - 'server-api/**'
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging-futai-member-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-api:
    name: futai-member-api → Cloud Run (staging)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE_NAME: futai-member-api
      REGION: asia-east1
      ARTIFACT_REGISTRY: asia-east1-docker.pkg.dev
      REPOSITORY_NAME: ${{ secrets.ARTIFACT_REGISTRY_REPOSITORY || 'forte-membership' }}
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      RUNTIME_SA: ${{ secrets.CLOUD_RUN_RUNTIME_SA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:latest"
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE_TAG" \
            --tag "$IMAGE_LATEST" \
            --file server-api/Dockerfile \
            --push \
            .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then echo "::error::設定 staging GCP_PROJECT_ID"; exit 1; fi
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then echo "::error::設定 staging DATABASE_URL (Supabase)"; exit 1; fi
          if [ -z "${{ secrets.QR_SIGNING_SECRET }}" ]; then echo "::error::設定 staging QR_SIGNING_SECRET"; exit 1; fi
          if [ -z "${{ secrets.CLOUD_RUN_RUNTIME_SA }}" ]; then echo "::error::設定 staging CLOUD_RUN_RUNTIME_SA"; exit 1; fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE_TAG }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 20 \
            --timeout 120 \
            --max-instances 1 \
            --min-instances 0 \
            --service-account="${{ env.RUNTIME_SA }}" \
            --set-env-vars "ENVIRONMENT=staging" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}" \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}" \
            --set-env-vars "LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
            --set-env-vars "LIFF_ID_REGISTER=${{ secrets.LIFF_ID_REGISTER }}" \
            --set-env-vars "LIFF_ID_MEMBER_QR=${{ secrets.LIFF_ID_MEMBER_QR }}" \
            --set-env-vars "QR_SIGNING_SECRET=${{ secrets.QR_SIGNING_SECRET }}" \
            --set-env-vars "STAFF_PIN_HASH=${{ secrets.STAFF_PIN_HASH }}"

      - name: Patch BASE_URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)')
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --update-env-vars "BASE_URL=${SERVICE_URL}"
          echo "Deployed: ${SERVICE_URL}"
          echo "LINE Webhook: ${SERVICE_URL}/api/line/webhook"
